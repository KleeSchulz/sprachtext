name: APK bauen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Debug-APK bauen
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Fehler als Hinweise ausgeben
        if: failure()
        run: |
          grep -nE "error:|error |FAILED|What went wrong|CMake Error|undefined reference|> " build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done

      - name: APK-Inhalt anzeigen
        run: |
          unzip -l app/build/outputs/apk/debug/*.apk | grep -E "\.so|classes" | while IFS= read -r l; do echo "::notice::$l"; done

      - uses: actions/upload-artifact@v4
        with:
          name: Sprachtext-APK
          path: app/build/outputs/apk/debug/*.apk
