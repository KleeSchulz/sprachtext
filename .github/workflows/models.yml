name: Modelle bauen

# Wandelt deutsch trainierte Whisper-Modelle ins whisper.cpp-Format um,
# komprimiert sie und stellt sie als Release "models" zum Download bereit.
# Bereits vorhandene Dateien werden übersprungen.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/models.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Release "models" anlegen (falls nötig)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view models --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create models --repo "$GITHUB_REPOSITORY" --title "Modelle" \
              --notes "Whisper-Modelle für Sprachtext (whisper.cpp-Format), umgewandelt aus deutsch trainierten Modellen auf Hugging Face."

  convert:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { hf: primeline/whisper-large-v3-turbo-german,   out: ggml-large-v3-turbo-german-q5_0.bin,   quant: q5_0 }
          - { hf: primeline/distil-whisper-large-v3-german,  out: ggml-distil-large-v3-german-q5_0.bin,  quant: q5_0 }
          - { hf: primeline/whisper-tiny-german,             out: ggml-tiny-german-q8_0.bin,             quant: q8_0 }
          - { hf: vilassn/whisper-small-german,              out: ggml-small-german-vilassn-q5_1.bin,    quant: q5_1 }
          - { hf: bofenghuang/whisper-small-cv11-german,     out: ggml-small-german-cv11-q5_1.bin,       quant: q5_1 }
    steps:
      - name: Schon vorhanden?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view models --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qx "${{ matrix.out }}"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "::notice::${{ matrix.out }} existiert bereits"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Platz schaffen
        if: steps.check.outputs.skip == 'false'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip == 'false'
        with:
          python-version: '3.11'

      - name: Werkzeuge installieren
        if: steps.check.outputs.skip == 'false'
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet transformers safetensors numpy huggingface_hub
          git clone --depth 1 https://github.com/openai/whisper /tmp/openai-whisper
          git clone --depth 1 --branch v1.9.5 https://github.com/ggml-org/whisper.cpp /tmp/whisper.cpp
          # Gewichte liegen teils als bfloat16 vor – das Skript braucht float32 (numpy kennt kein bfloat16)
          sed -i 's/\.squeeze()\.numpy()/.squeeze().float().numpy()/' /tmp/whisper.cpp/models/convert-h5-to-ggml.py
          cd /tmp/whisper.cpp
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_EXAMPLES=ON -DWHISPER_BUILD_TESTS=OFF -DWHISPER_SDL2=OFF > /dev/null
          cmake --build build --target whisper-quantize -j 4 > /dev/null

      - name: Modell herunterladen
        if: steps.check.outputs.skip == 'false'
        run: |
          python - <<'EOF'
          from huggingface_hub import snapshot_download
          # Nur die Dateien im Hauptordner (keine Zwischenstände/Checkpoints)
          snapshot_download("${{ matrix.hf }}", local_dir="/tmp/hf-model", allow_patterns=[
              "config.json", "generation_config.json", "preprocessor_config.json",
              "tokenizer.json", "tokenizer_config.json", "special_tokens_map.json",
              "vocab.json", "added_tokens.json", "merges.txt", "normalizer.json",
              "model.safetensors", "model.safetensors.index.json", "model-*.safetensors",
              "pytorch_model.bin", "pytorch_model.bin.index.json", "pytorch_model-*.bin"])
          EOF
          cd /tmp/hf-model
          # Das Konvertierungsskript braucht vocab.json und added_tokens.json
          python - <<'EOF'
          import json, os
          from transformers import AutoTokenizer
          tok = AutoTokenizer.from_pretrained(".")
          if not os.path.exists("vocab.json"):
              json.dump(tok.get_vocab(), open("vocab.json", "w", encoding="utf8"), ensure_ascii=False)
          if not os.path.exists("added_tokens.json"):
              json.dump(tok.get_added_vocab(), open("added_tokens.json", "w", encoding="utf8"), ensure_ascii=False)
          EOF
          ls -la /tmp/hf-model

      - name: Umwandeln und komprimieren
        if: steps.check.outputs.skip == 'false'
        run: |
          mkdir -p /tmp/out
          python /tmp/whisper.cpp/models/convert-h5-to-ggml.py /tmp/hf-model /tmp/openai-whisper /tmp/out > /tmp/conv.log 2>&1 \
            || { tail -n 9 /tmp/conv.log | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
          /tmp/whisper.cpp/build/bin/whisper-quantize /tmp/out/ggml-model.bin /tmp/out/${{ matrix.out }} ${{ matrix.quant }} > /tmp/q.log 2>&1 \
            || { tail -n 9 /tmp/q.log | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
          ls -la /tmp/out

      - name: Hochladen
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload models /tmp/out/${{ matrix.out }} --repo "$GITHUB_REPOSITORY" --clobber
          echo "::notice::${{ matrix.out }}: $(stat -c %s /tmp/out/${{ matrix.out }}) Bytes"
