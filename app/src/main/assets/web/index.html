<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1412">
  <title>Sprachtext</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Sprachtext</h1>
    <p class="sub">Sprachnachricht in WhatsApp teilen → hier als Text</p>
  </header>

  <main>
    <section class="card" id="drop">
      <label class="btn primary" for="file">Audiodatei wählen</label>
      <input type="file" id="file" accept="audio/*,.opus,.ogg,.m4a,.mp3,.wav" hidden>
      <p class="hint">Oder in WhatsApp: Sprachnachricht gedrückt halten → Teilen → <b>Sprachtext</b></p>
    </section>

    <section class="card hidden" id="work">
      <div class="status" id="status">…</div>
      <div class="bar"><div id="barfill"></div></div>
      <div class="meta" id="meta"></div>
    </section>

    <section class="card hidden" id="result">
      <textarea id="text" rows="8" placeholder="Transkript"></textarea>
      <div class="row">
        <button class="btn primary" id="copy">Kopieren</button>
        <button class="btn" id="share">Teilen</button>
      </div>
    </section>

    <details class="card" id="settings">
      <summary>Einstellungen</summary>
      <label>Modell
        <select id="model">
          <option value="onnx-community/whisper-tiny">Tiny – schnell, ungenau (~40 MB)</option>
          <option value="onnx-community/whisper-base" selected>Base – Standard (~80 MB)</option>
          <option value="onnx-community/whisper-small">Small – gut für Deutsch, langsam (~250 MB)</option>
        </select>
      </label>
      <label>Sprache
        <select id="lang">
          <option value="german" selected>Deutsch</option>
          <option value="auto">Automatisch erkennen</option>
          <option value="english">Englisch</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="gpu" checked> GPU nutzen, falls verfügbar</label>
      <p class="hint">Das Modell wird einmal geladen und dann im Browser gespeichert. Die Audiodateien verlassen dein Handy nicht.</p>
    </details>

    <section class="card hidden" id="historyBox">
      <h2>Verlauf</h2>
      <ul id="history"></ul>
      <button class="btn small" id="clearHist">Verlauf löschen</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
