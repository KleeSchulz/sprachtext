plugins {
    id 'com.android.application'
}

android {
    namespace 'de.sprachtext.app'
    compileSdk 34

    defaultConfig {
        applicationId 'de.sprachtext.app'
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName '2.3'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    // Fester Schlüssel, damit jede neue APK über die alte installiert werden kann.
    // Nur für die private Test-Version gedacht – für den Play Store gäbe es einen eigenen, geheimen Schlüssel.
    signingConfigs {
        fixed {
            storeFile file('sprachtext.keystore')
            storePassword 'sprachtext'
            keyAlias 'sprachtext'
            keyPassword 'sprachtext'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
