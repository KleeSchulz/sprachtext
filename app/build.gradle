plugins {
    id 'com.android.application'
}

android {
    namespace 'de.sprachtext.app'
    compileSdk 34

    defaultConfig {
        applicationId 'de.sprachtext.app'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '2.1'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
